name: Prepare registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Prepare approved releases
        run: cargo +stable run --locked -- prepare --input registry-input.json --approvals approved-publishers.json --output prepared-registry
      - uses: actions/upload-artifact@v4
        with:
          name: verified-registry-signing-input
          path: prepared-registry/
          if-no-files-found: error
          retention-days: 7
