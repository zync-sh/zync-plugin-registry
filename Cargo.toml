[package]
name = "zync-registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Verification tools for the Zync plugin registry"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
